name: Bug report
description: Something caddy-edge or one of its actions does wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security problem? Do not file it here: use the [private reporting form](https://github.com/pungoyal/caddy-edge/security/advisories/new).
        Replace real hostnames and addresses with `example.com` before pasting anything.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The site file, the action's inputs (no secrets) and the failing step's log.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: caddy-edge version or commit
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host OS and Docker version
      placeholder: Ubuntu 24.04, Docker 28.3
