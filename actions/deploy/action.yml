name: Deploy caddy-edge
description: Ships Caddy's configuration and your site files to a Docker host over SSH and reloads Caddy, restoring the previous config if that fails.

inputs:
  sites:
    description: Directory of *.caddy site files in the workspace.
    required: true
  ssh-host:
    description: Address of the Docker host.
    required: true
  ssh-user:
    description: SSH user on the host, in the docker group.
    required: true
  ssh-port:
    description: SSH port.
    required: false
    default: "22"
  ssh-private-key:
    description: Private half of the deploy key.
    required: true
  ssh-known-hosts:
    description: The host's known_hosts line(s), e.g. from ssh-keyscan -t ed25519.
    required: true
  deploy-path:
    description: Absolute directory on the host to deploy into. It must exist and be writable by the SSH user.
    required: true
  docker-network:
    description: Existing Docker network that Caddy and every application join.
    required: true
  acme-email:
    description: Contact address for the ACME account.
    required: true
  dry-run:
    description: "true: connect to the host, check it is ready and print what a deploy would change, without changing anything."
    required: false
    default: "false"

outputs:
  plan:
    description: "With dry-run: first (nothing is deployed yet), reload (Caddy would reload the config), recreate (the container would be replaced: a few seconds of downtime) or none (nothing differs)."
    value: ${{ steps.deploy.outputs.plan }}

runs:
  using: composite
  steps:
    # A new variable is one line in deploy/.env.example and one in this env.
    - name: Assemble
      shell: bash
      env:
        SITES: ${{ inputs.sites }}
        DOCKER_NETWORK: ${{ inputs.docker-network }}
        ACME_EMAIL: ${{ inputs.acme-email }}
      run: |
        [[ -n $SITES ]] || { echo "::error::sites is required" >&2; exit 1; }
        "$GITHUB_ACTION_PATH/../assemble.sh" "$SITES" "$RUNNER_TEMP/edge"
        cd "$RUNNER_TEMP/edge"
        umask 077
        for k in $(grep -oE '^[A-Z][A-Z0-9_]*' .env.example); do
          v=${!k-}
          if [[ $v == *"'"* || $v == *$'\n'* ]]; then
            echo "::error::$k contains a quote or a newline" >&2
            exit 1
          fi
          printf "%s='%s'\n" "$k" "$v"
        done > .env
        rm .env.example
        docker compose config -q

    # Via env, not expanded into the script, so contents cannot alter commands. In its
    # own directory with -F, so the job's ~/.ssh is neither read nor changed.
    - name: Configure SSH
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_PORT: ${{ inputs.ssh-port }}
      run: |
        # Each becomes a line of ssh_config, where a newline would start another option.
        [[ $SSH_HOST =~ ^[A-Za-z0-9._:-]+$ ]] || { echo "::error::invalid ssh-host" >&2; exit 1; }
        [[ $SSH_USER =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]] || { echo "::error::invalid ssh-user" >&2; exit 1; }
        [[ $SSH_PORT =~ ^[0-9]{1,5}$ ]] || { echo "::error::invalid ssh-port" >&2; exit 1; }
        dir=$RUNNER_TEMP/edge-ssh
        rm -rf "$dir" && mkdir -m 700 "$dir"
        umask 077
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$dir/key"
        printf '%s\n' "$SSH_KNOWN_HOSTS" > "$dir/known_hosts"
        {
          echo "Host edge"
          echo "  HostName $SSH_HOST"
          echo "  User $SSH_USER"
          echo "  Port $SSH_PORT"
          echo "  IdentityFile $dir/key"
          echo "  IdentitiesOnly yes"
          echo "  StrictHostKeyChecking yes"
          echo "  UserKnownHostsFile $dir/known_hosts"
        } > "$dir/config"

    # caddy/ is emptied and refilled, never replaced: the container mounts that directory,
    # and a new one would leave it reading the old. `up` recreates Caddy only when
    # compose.yaml changed; otherwise the reload applies the config with no dropped
    # connection, and a config Caddy rejects leaves the old one serving.
    - name: Deploy
      id: deploy
      shell: bash
      env:
        DEPLOY_PATH: ${{ inputs.deploy-path }}
        DOCKER_NETWORK: ${{ inputs.docker-network }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -o pipefail
        # ssh hands the remote shell one string, so the path is constrained, not quoted.
        [[ $DEPLOY_PATH =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid deploy-path" >&2; exit 1; }
        on_host() { ssh -F "$RUNNER_TEMP/edge-ssh/config" edge "cd $DEPLOY_PATH && $1"; }
        put() { echo "mkdir -p caddy && find caddy -mindepth 1 -delete && cp -a $1/compose.yaml $1/.env $1/caddy ."; }
        up='docker compose up -d --quiet-pull --remove-orphans --wait --wait-timeout 60 && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile'

        if [[ $DRY_RUN == true ]]; then
          # Every command here only reads. The comparison happens on the runner, so
          # nothing is written to the host, not even a temporary file.
          [[ $DOCKER_NETWORK =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || { echo "::error::invalid docker-network" >&2; exit 1; }
          on_host 'test -w .' || { echo "::error::deploy-path is missing or not writable by the SSH user" >&2; exit 1; }
          on_host 'docker compose version' || { echo "::error::the SSH user cannot run docker compose" >&2; exit 1; }
          on_host "docker network inspect $DOCKER_NETWORK >/dev/null" || { echo "::error::the Docker network does not exist on the host" >&2; exit 1; }
          new=$RUNNER_TEMP/edge cur=$RUNNER_TEMP/edge-current
          rm -rf "$cur" && mkdir "$cur"
          if on_host 'test ! -f compose.yaml'; then
            plan=first
            echo "Nothing is deployed here yet: this would be the first deploy."
          else
            on_host 'docker compose ps'
            on_host 'tar -cf - compose.yaml .env caddy' | tar -xf - -C "$cur"
            # .env is compared, not printed: a job log is no place for its values.
            if ! cmp -s "$cur/compose.yaml" "$new/compose.yaml" || ! cmp -s "$cur/.env" "$new/.env"; then
              plan=recreate
              echo "compose.yaml or .env differs: Caddy would be recreated, and sites would drop for a few seconds."
            elif ! diff -rq "$cur/caddy" "$new/caddy" >/dev/null; then
              plan=reload
              echo "Only the Caddy config differs: Caddy would reload it, with no dropped connection."
            else
              plan=none
              echo "Nothing differs from what is deployed."
            fi
            diff -u "$cur/compose.yaml" "$new/compose.yaml" || true
            diff -ruN "$cur/caddy" "$new/caddy" || true
          fi
          rm -rf "$cur"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        on_host 'rm -rf previous next && mkdir previous next'
        # Nothing serves yet on the first deploy. Tested there: here a failed connection
        # would read as a missing file.
        on_host 'test ! -f compose.yaml || cp -a compose.yaml .env caddy previous/'
        # -p: Caddy runs without DAC_OVERRIDE, and the login umask may hide the files from it.
        tar -C "$RUNNER_TEMP/edge" -cf - compose.yaml .env caddy | on_host 'tar -xpf - -C next'
        on_host "$(put next) && $up" || {
          # Without the access log: it holds visitors' addresses and URLs, and this job's
          # log may be public.
          on_host 'docker compose logs --no-log-prefix --tail=500 2>&1 | grep -v "\"logger\":\"http.log.access" | tail -n 50' || true
          on_host 'test ! -f previous/compose.yaml' || on_host "$(put previous) && $up" || true
          exit 1
        }
        # Only Caddy's: the server is shared, and other projects keep images to roll back to.
        on_host 'rm -rf next; docker image prune -af --filter label=org.opencontainers.image.title=Caddy' || true

    - name: Remove the deploy key
      if: always()
      shell: bash
      run: rm -rf "$RUNNER_TEMP/edge-ssh"
